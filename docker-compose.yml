# ResearchReel — full stack behind one public entry point (nginx on ${PUBLIC_PORT:-8080}).
# Copy .env.example to .env and fill in the required values first.
#   docker compose up --build -d
# Only the gateway is published; databases and internal services stay on the private network.
# CI publishes images to GHCR; a server can run them with
#   IMAGE_PREFIX=ghcr.io/goldypahal/researchreel IMAGE_TAG=<commit sha> docker compose pull && docker compose up -d --no-build

x-db-url: &db_url postgresql://${POSTGRES_USER:-researchreel}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-researchreel}
x-redis-url: &redis_url redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-researchreel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-researchreel}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Malware scanning for uploads. It takes a few minutes to load signatures on first start;
  # uploads are refused (503) until it is ready rather than accepted unscanned.
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes:
      - clamav_db:/var/lib/clamav
    networks: [internal]

  # Applies database migrations, then exits. The API waits for it.
  migrate:
    image: ${IMAGE_PREFIX:-researchreel}/api:${IMAGE_TAG:-latest}
    build:
      context: ./backend
    command: ["npx", "node-pg-migrate", "up", "-m", "migrations"]
    environment:
      DATABASE_URL: *db_url
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    restart: "no"

  rag-service:
    image: ${IMAGE_PREFIX:-researchreel}/rag:${IMAGE_TAG:-latest}
    build:
      context: ./backend/research_rag
    restart: unless-stopped
    environment:
      PORT: 8000
      RAG_API_KEY: ${RAG_API_KEY:?Set RAG_API_KEY in .env}
      DATABASE_URL: *db_url
      REDIS_URL: *redis_url
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      QDRANT_URL: ${QDRANT_URL:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]

  api:
    image: ${IMAGE_PREFIX:-researchreel}/api:${IMAGE_TAG:-latest}
    build:
      context: ./backend
    restart: unless-stopped
    environment: &api_env
      NODE_ENV: production
      PORT: 5000
      START_WORKER: "false"
      DATABASE_URL: *db_url
      REDIS_URL: *redis_url
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      FILE_URL_SECRET: ${FILE_URL_SECRET:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost:8080}
      PUBLIC_API_ORIGIN: ${PUBLIC_URL:-http://localhost:8080}
      ORCID_REDIRECT_URI: ${PUBLIC_URL:-http://localhost:8080}/api/v1/auth/orcid/callback
      ORCID_CLIENT_ID: ${ORCID_CLIENT_ID:-}
      ORCID_CLIENT_SECRET: ${ORCID_CLIENT_SECRET:-}
      ORCID_BASE_URL: ${ORCID_BASE_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      RAG_SERVICE_URL: http://rag-service:8000/api/v1
      RAG_API_KEY: ${RAG_API_KEY:?Set RAG_API_KEY in .env}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_SCHOLAR_PRICE_ID: ${STRIPE_SCHOLAR_PRICE_ID:-}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID:-}
      STRIPE_ENTERPRISE_PRICE_ID: ${STRIPE_ENTERPRISE_PRICE_ID:-}
      ACADEMIC_EMAIL_DOMAINS: ${ACADEMIC_EMAIL_DOMAINS:-}
    volumes:
      - media_uploads:/app/public/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      clamav:
        condition: service_started
      rag-service:
        condition: service_started
    networks: [internal]

  # BullMQ worker: video rendering (FFmpeg) and scheduled reel uploads.
  worker:
    image: ${IMAGE_PREFIX:-researchreel}/api:${IMAGE_TAG:-latest}
    build:
      context: ./backend
    command: ["node", "src/worker.js"]
    restart: unless-stopped
    environment:
      <<: *api_env
      START_WORKER: "true"
    volumes:
      - media_uploads:/app/public/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [internal]

  web:
    image: ${IMAGE_PREFIX:-researchreel}/web:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_URL:-http://localhost:8080}/api/v1
        NEXT_PUBLIC_WSS_URL: ${PUBLIC_URL:-http://localhost:8080}
        NEXT_PUBLIC_SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_URL:-http://localhost:8080}
        NEXT_PUBLIC_SENTRY_DSN: ${SENTRY_DSN:-}
        NEXT_PUBLIC_POSTHOG_KEY: ${POSTHOG_KEY:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${POSTHOG_HOST:-}
    restart: unless-stopped
    environment:
      # Server-side reads for link previews and the sitemap go straight to the API container.
      API_INTERNAL_URL: http://api:5000/api/v1
    depends_on:
      - api
    networks: [internal]

  # Single public entry point: /api, /socket.io and /uploads go to the API, everything else to the web app.
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${PUBLIC_PORT:-8080}:80"
    depends_on:
      - api
      - web
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  clamav_db:
  media_uploads:
