name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  # GHCR image names must be lowercase.
  IMAGE_PREFIX: ghcr.io/goldypahal/researchreel

jobs:
  backend:
    name: Backend (audit, migrations, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: researchreel_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Migrations apply cleanly to an empty database (and the latest one rolls back)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/researchreel_ci
        run: |
          npx node-pg-migrate up -m migrations
          npx node-pg-migrate down -m migrations
          npx node-pg-migrate up -m migrations
      - name: Tests
        run: npm test

  frontend:
    name: Frontend (audit, lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install
      - name: Dependency audit
        run: npm audit --audit-level=high
      - run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - run: npm run build

  images:
    name: Build and push images
    needs: [backend, frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: ./backend
          - name: rag
            context: ./backend/research_rag
          - name: web
            context: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:latest
          # The web image inlines its public settings at build time (repository variables).
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PUBLIC_URL || 'http://localhost:8080' }}/api/v1
            NEXT_PUBLIC_WSS_URL=${{ vars.PUBLIC_URL || 'http://localhost:8080' }}
            NEXT_PUBLIC_SUPPORT_EMAIL=${{ vars.SUPPORT_EMAIL }}
            NEXT_PUBLIC_SITE_URL=${{ vars.PUBLIC_URL || 'http://localhost:8080' }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.SENTRY_DSN }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ vars.POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ vars.POSTHOG_HOST }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Deploys the Docker Compose stack to a server over SSH. Runs only once the
  # DEPLOY_HOST repository variable is set — see docs/deployment.md.
  deploy:
    name: Deploy
    needs: images
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          if [ -n "$KNOWN_HOSTS" ]; then printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts; else ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts; fi

      - name: Pull new images and restart
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          USER: ${{ vars.DEPLOY_USER || 'deploy' }}
          APP_DIR: ${{ vars.DEPLOY_PATH || '/opt/researchreel' }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/deploy_key "$USER@$HOST" \
            "APP_DIR='$APP_DIR' SHA='${{ github.sha }}' PREFIX='${{ env.IMAGE_PREFIX }}' ACTOR='${{ github.actor }}' GHCR_TOKEN='$GHCR_TOKEN' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          git fetch --quiet origin main
          git checkout --quiet "$SHA"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin >/dev/null
          export IMAGE_PREFIX="$PREFIX" IMAGE_TAG="$SHA"
          docker compose pull --quiet api web rag-service
          docker compose up -d --no-build --remove-orphans
          docker logout ghcr.io >/dev/null
          docker image prune -f >/dev/null
          REMOTE

      - name: Wait for the site to come up
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          if [ -z "$PUBLIC_URL" ]; then echo "PUBLIC_URL variable not set; skipping health check"; exit 0; fi
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$PUBLIC_URL/api/v1/health" || true)
            if [ "$code" = "200" ]; then echo "Healthy after $((i*10))s"; exit 0; fi
            sleep 10
          done
          echo "Health check did not return 200 within 5 minutes (last: $code)"; exit 1
