worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 200m;   # video and PDF uploads

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream api      { server api:5000; }
    upstream web      { server web:3000; }

    server {
        listen 80;
        server_name _;

        gzip on;
        gzip_types text/plain text/css application/javascript application/json image/svg+xml;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # REST API (single Express service, versioned under /api/v1)
        location /api/ {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://api;
        }

        # Real-time messaging
        location /socket.io/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }

        # Uploaded media served by the API
        location /uploads/ {
            proxy_pass http://api;
        }

        # Everything else is the Next.js app
        location / {
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
