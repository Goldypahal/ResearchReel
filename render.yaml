# Render Blueprint — deploy with "New > Blueprint" in the Render dashboard.
# Creates: PostgreSQL, Key Value (Redis), the API (Docker, with a persistent disk
# for uploads), the Research RAG service (private, with a disk for its index)
# and the Next.js web app. Values marked `sync: false` are asked for
# when you create the Blueprint. See DEPLOYMENT.md for the step-by-step guide.

databases:
  - name: researchreel-db
    databaseName: researchreel
    user: researchreel
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  # Redis for sessions, OTPs, rate limits, background jobs and realtime fan-out.
  - type: keyvalue
    name: researchreel-redis
    plan: starter
    maxmemoryPolicy: noeviction # required by the job queue
    ipAllowList: [] # private network only

  # API server (Express + Socket.io + media worker). Runs migrations on every start.
  - type: web
    name: researchreel-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: starter
    healthCheckPath: /api/v1/health
    disk:
      name: uploads
      mountPath: /app/public/uploads
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: researchreel-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: researchreel-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false # e.g. https://researchreel-web.onrender.com (or your custom domain)
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "true" # set to "false" to launch before configuring SMTP
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false # e.g. "ResearchReel <no-reply@yourdomain.com>"
      - key: GEMINI_API_KEY
        sync: false # optional: enables AI answers, summaries, scripts and narration
      - key: CROSSREF_MAILTO
        sync: false # optional: contact email sent to Crossref for DOI lookups
      - key: CLAMAV_HOST
        sync: false # optional: host of a ClamAV daemon to scan uploads (see DEPLOYMENT.md)
      # Multi-paper search with cited answers and research tools (see the rag service below).
      - key: RAG_SERVICE_URL
        fromService:
          type: pserv
          name: researchreel-rag
          property: hostport
      - key: RAG_API_KEY
        fromService:
          type: pserv
          name: researchreel-rag
          envVarKey: RAG_API_KEY

  # Research RAG service (Python/FastAPI): indexes every uploaded PDF and answers
  # questions across several papers with page citations. Private: only the API can reach it.
  # Needs a Gemini key; without one it starts but cannot index or answer.
  - type: pserv
    name: researchreel-rag
    runtime: docker
    dockerContext: ./backend/research_rag
    dockerfilePath: ./backend/research_rag/Dockerfile
    plan: standard # 2 GB RAM; the vector index and PDF parsing need more than 512 MB
    disk:
      name: rag-data
      mountPath: /app/data
      sizeGB: 5
    envVars:
      - key: RAG_API_KEY
        generateValue: true
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false # the same Gemini key as the API
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001 # changing this needs a full re-index (npm run rag:reindex -- --all)
      - key: COHERE_API_KEY
        sync: false # optional: better passage ranking

  # Next.js web app. Proxies /api, /uploads and websockets to the API over the
  # private network, so the browser only ever talks to this domain.
  - type: web
    name: researchreel-web
    runtime: node
    rootDir: frontend
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: BACKEND_HOSTPORT
        fromService:
          type: web
          name: researchreel-api
          property: hostport
      - key: NEXT_PUBLIC_UPLOAD_URL
        sync: false # public URL of the API, e.g. https://researchreel-api.onrender.com (large uploads go there directly)
      - key: NEXT_PUBLIC_SUPPORT_EMAIL
        sync: false # optional, shown on the Help page
      - key: NEXT_PUBLIC_SITE_URL
        sync: false # optional: your custom domain (https://...). Link previews and the sitemap use the Render URL otherwise
