# Render Blueprint — deploy with "New > Blueprint" in the Render dashboard.
# Creates: PostgreSQL (with point-in-time recovery), Key Value (Redis),
# the API server (Docker, stateless), a Background Worker (Docker standard 2GB for FFmpeg),
# the Research RAG service (private, persistent vector store) and the Next.js web app.
# See DEPLOYMENT.md and docs/RUNBOOK.md for the step-by-step guide.

databases:
  - name: researchreel-db
    databaseName: researchreel
    user: researchreel
    plan: basic-1gb # Supports automated daily backups & point-in-time recovery (PITR)
    postgresMajorVersion: "16"

services:
  # Redis for sessions, OTPs, rate limits, background jobs and realtime fan-out.
  - type: keyvalue
    name: researchreel-redis
    plan: starter
    maxmemoryPolicy: noeviction # required by the job queue
    ipAllowList: [] # private network only

  # API server (Express + Socket.io). Runs migrations on every start.
  - type: web
    name: researchreel-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: starter
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: researchreel-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: researchreel-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: TRUST_PROXY_HOPS
        value: "2" # Accounts for Render edge + Next.js rewrite hops
      - key: START_WORKER
        value: "false" # Offload video rendering & queue processing to dedicated worker
      - key: FRONTEND_URL
        sync: false # e.g. https://researchreel-web.onrender.com (or your custom domain)
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "true" # set to "false" to launch before configuring email
      - key: RESEND_API_KEY
        sync: false # email via Resend (recommended); leave the SMTP_* values blank when set
      - key: EMAIL_FROM
        sync: false # e.g. "ResearchReel <no-reply@yourdomain.com>"; domain must be verified in Resend
      - key: SMTP_HOST
        sync: false # only if you use another provider over SMTP instead of Resend
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: GEMINI_API_KEY
        sync: false # enables AI answers, summaries, scripts and narration
      - key: AI_DAILY_LIMIT
        value: "100" # budget protection per active user/day
      - key: SENTRY_DSN
        sync: false # optional: production error tracking
      - key: CROSSREF_MAILTO
        sync: false # optional: contact email sent to Crossref for DOI lookups
      - key: CLAMAV_HOST
        sync: false # optional: host of a ClamAV daemon to scan uploads (see DEPLOYMENT.md)
      # Cloudflare R2 / S3 Object Storage (recommended for multi-instance scaling & fast CDN)
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ENDPOINT
        sync: false # e.g. https://<account_id>.r2.cloudflarestorage.com
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_URL
        sync: false # e.g. https://media.yourdomain.com
      # Multi-paper search with cited answers and research tools (see the rag service below).
      - key: RAG_SERVICE_URL
        fromService:
          type: pserv
          name: researchreel-rag
          property: hostport
      - key: RAG_API_KEY
        fromService:
          type: pserv
          name: researchreel-rag
          envVarKey: RAG_API_KEY

  # Render Background Worker for FFmpeg rendering, narration synthesis & BullMQ queues
  - type: worker
    name: researchreel-worker
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: node src/worker.js
    plan: standard # 2 GB RAM minimum; FFmpeg reel rendering requires memory headroom
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: researchreel-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: researchreel-redis
          property: connectionString
      - key: JWT_SECRET
        fromService:
          type: web
          name: researchreel-api
          envVarKey: JWT_SECRET
      - key: ENCRYPTION_KEY
        fromService:
          type: web
          name: researchreel-api
          envVarKey: ENCRYPTION_KEY
      - key: FRONTEND_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_URL
        sync: false

  # Research RAG service (Python/FastAPI): indexes every uploaded PDF and answers
  # questions across several papers with page citations. Private: only the API can reach it.
  - type: pserv
    name: researchreel-rag
    runtime: docker
    dockerContext: ./backend/research_rag
    dockerfilePath: ./backend/research_rag/Dockerfile
    plan: standard # 2 GB RAM; vector index and PDF parsing need more than 512 MB
    disk:
      name: rag-data
      mountPath: /app/data
      sizeGB: 5
    envVars:
      - key: RAG_API_KEY
        generateValue: true
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false # same Gemini key as the API
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: COHERE_API_KEY
        sync: false

  # Next.js web app. Proxies /api, /uploads and websockets to the API over the
  # private network, so the browser only ever talks to this domain.
  - type: web
    name: researchreel-web
    runtime: node
    rootDir: frontend
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: BACKEND_HOSTPORT
        fromService:
          type: web
          name: researchreel-api
          property: hostport
      - key: NEXT_PUBLIC_UPLOAD_URL
        sync: false # public URL of the API, e.g. https://researchreel-api.onrender.com (large uploads go there directly)
      - key: NEXT_PUBLIC_SUPPORT_EMAIL
        sync: false # optional, shown on the Help page
      - key: NEXT_PUBLIC_SITE_URL
        sync: false # optional: your custom domain (https://...). Link previews and sitemap use Render URL otherwise
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false # optional: client-side error monitoring
